[tool.ruff]
# Версия Python
target-version = "py314"
# Максимальная длина строки
line-length = 100

# Исключаемые директории
exclude = [
    "venv",
    "__pycache__",
]

[tool.ruff.lint]
# Набор правил
select = [
    "E",   # ошибки синтаксиса
    "W",   # предупреждения
    "F",   # неиспользуемые импорты и переменные
    "I",   # сортировка импортов
    "N",   # pep8 правила именования
    "UP",  # использование современных фич
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # Ruff-specific rules
    "T20", # flake8-print
    "ARG", # flake8-unused-arguments
    "PTH", # flake8-use-pathlib
]

ignore = [
    "PTH123",   # замена open на Path.open
]
